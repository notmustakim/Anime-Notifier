name: Anime Notifier

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run anime notifier
        env:
          ANILIST_NOTIFIER_SMTP_PASSWORD: ${{ secrets.ANILIST_NOTIFIER_SMTP_PASSWORD }}
        run: python anilist_notifier.py --once

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add anilist_state.json

          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update anime notifier state"
            git push
          fi
