name: Anime Notifier

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:


concurrency:
  group: anime-notifier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create config
        env:
          EMAIL: ${{ secrets.ANILIST_NOTIFIER_EMAIL }}
          RECEIVER: ${{ secrets.ANILIST_NOTIFIER_RECEIVER }}
          ANILIST_USERNAME: ${{ secrets.ANILIST_NOTIFIER_ANILIST_USERNAME }}
          ANILIST_TOKEN: ${{ secrets.ANILIST_NOTIFIER_ANILIST_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os

          config = {
              "email": {
                  "sender": os.environ["EMAIL"],
                  "receiver": os.environ["RECEIVER"],
                  "sender_name": "Anime Notifier",
                  "smtp_server": "smtp.gmail.com",
                  "smtp_port": 587
              },
              "anilist": {
                  "username": os.environ["ANILIST_USERNAME"],
                  "token": os.environ["ANILIST_TOKEN"]
              },
              "check_interval": 3600,
              "notify_before_release": True,
              "hours_before_notify": 24,
              "notify_after_release": True
          }

          with open("config.json", "w") as f:
              json.dump(config, f, indent=4)
          PY

      - name: Run anime notifier
        env:
          ANILIST_NOTIFIER_SMTP_PASSWORD: ${{ secrets.ANILIST_NOTIFIER_SMTP_PASSWORD }}
        run: python anilist_notifier.py --once

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add anilist_state.json

          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi

          git commit -m "Update anime notifier state"

          git pull --rebase origin main
          git push origin main
